name: Backend CI

on:
  push:
    branches: [develop]
    paths:
      - 'monolith/**'
      - 'payments-service/**'
      - 'kyc-service/**'
      - 'audit-service/**'
      - 'shared/uuid-v7/**'
      - 'shared/money/**'
      - 'shared/time/**'
      - 'shared/events-java/**'
      - 'pom.xml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'monolith/**'
      - 'payments-service/**'
      - 'kyc-service/**'
      - 'audit-service/**'
      - 'shared/uuid-v7/**'
      - 'shared/money/**'
      - 'shared/time/**'
      - 'shared/events-java/**'
      - 'pom.xml'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-and-test:
    name: Build & Unit Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven .m2 repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and run unit tests
        run: mvn clean verify --batch-mode --no-transfer-progress

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/target/surefire-reports/*.xml'
          retention-days: 7
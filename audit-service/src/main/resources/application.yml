spring:
  application:
    name: stash-audit

  config:
    import: optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://${AUDIT_DB_HOST:localhost}:${AUDIT_DB_PORT:5435}/${AUDIT_DB_NAME:audit_db}
    username: ${AUDIT_DB_USER}
    password: ${AUDIT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 3000
      validation-timeout: 2000
      keepalive-time: 30000
      max-lifetime: 600000
      maximum-pool-size: 5
      pool-name: AuditHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
    open-in-view: false

  flyway:
    enabled: true
    locations:
      - classpath:db/migration/audit
    schemas: audit
    create-schemas: true
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: stash
    listener:
      simple:
        auto-startup: true
        acknowledge-mode: auto
        prefetch: 10

  jackson:
    time-zone: UTC

  mvc:
    problemdetails:
      enabled: false

server:
  port: 8083
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,rabbit
    prometheus:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    db:
      enabled: true
    rabbit:
      enabled: true
  metrics:
    tags:
      service: stash-audit
    enable:
      jvm: true
      process: true
      system: true
      hikaricp: true
      http:
        server:
          requests: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
stash:
  security:
    jwt:
      signing-key: ${JWT_SIGNING_KEY}
  audit:
    app-role: ${AUDIT_APP_ROLE:audit_app}
    readonly-role: ${AUDIT_READONLY_ROLE:audit_dashboard_ro}
    readonly-datasource:
      jdbc-url: ${AUDIT_READONLY_DB_URL:jdbc:postgresql://${AUDIT_DB_HOST:localhost}:${AUDIT_DB_PORT:5435}/${AUDIT_DB_NAME:audit_db}}
      username: ${AUDIT_READONLY_DB_USER:audit_dashboard_ro}
      password: ${AUDIT_READONLY_DB_PASSWORD}

logging:
  config: classpath:logback-spring.xml

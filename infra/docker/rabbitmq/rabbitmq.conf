# infra/docker/rabbitmq/rabbitmq.conf

# Default virtual host for Stash
default_vhost = stash

# NOTE (found via hands-on testing, see docs/hands-on-testing-findings.md
# Finding 4): the comment that used to be here said the default user comes
# from RABBITMQ_DEFAULT_USER/PASS in docker-compose "so credentials stay
# out of committed config." That was never actually true once
# management.load_definitions (below) is in play — definitions import
# creates/overwrites the "stash" user from definitions.json's own
# password_hash, and if that user doesn't exist yet when permissions are
# imported, boot fails outright ({no_such_user,...}). So the definitions
# file IS the real source of truth for the local-dev user/password, not
# the env vars. Its password_hash corresponds to .env.example's
# RABBITMQ_PASSWORD (change_me_rabbitmq) — regenerate it (SHA-256: 4-byte
# salt + sha256(salt+password), base64-encoded) if you change that value.

# Management plugin is enabled via the image tag (rabbitmq:3.13-management)
# This file just tunes its behaviour.
management.load_definitions = /etc/rabbitmq/definitions.json
# infra/prometheus/prometheus.yml
# Local dev Prometheus scrape configuration.
# Scrapes all four Stash backend services every 15 seconds.
#
# Note: services are addressed as host.docker.internal because Prometheus
# runs inside Docker while the services run on the host (via mvn spring-boot:run).
# When all services are containerised in a later milestone, change these
# targets to their Docker service names (e.g. monolith:8080).

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local

scrape_configs:

  - job_name: stash-monolith
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080
        labels:
          service: stash-monolith

  - job_name: stash-payments
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8081
        labels:
          service: stash-payments

  - job_name: stash-kyc
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8082
        labels:
          service: stash-kyc

  - job_name: stash-audit
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8083
        labels:
          service: stash-audit

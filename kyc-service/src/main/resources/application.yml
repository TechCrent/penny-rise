# KYC Service — application configuration
#
# NETWORK EGRESS POLICY (placeholder — enforcement in v1.0):
# This service is permitted to make outbound calls ONLY to:
#   - Ghana Card verification provider (KYC provider API)
#   - Supabase Storage (document upload/download via signed URLs)
# All other outbound traffic will be blocked at the egress gateway in production.
# See System Design doc §10.1 for the network boundary specification.

spring:
  application:
    name: stash-kyc

  config:
    import: optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://${KYC_DB_HOST:localhost}:${KYC_DB_PORT:5434}/${KYC_DB_NAME:kyc_db}
    username: ${KYC_DB_USER}
    password: ${KYC_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 5
      pool-name: KycHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
    open-in-view: false

  flyway:
    enabled: true
    locations:
      - classpath:db/migration/submission
      - classpath:db/migration/document
      - classpath:db/migration/outbox
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: stash

  jackson:
    time-zone: UTC

  mvc:
    problemdetails:
      enabled: false

server:
  port: 8082
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
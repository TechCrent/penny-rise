# KYC Service — application configuration
#
# NETWORK EGRESS POLICY (placeholder — enforcement in v1.0):
# This service is permitted to make outbound calls ONLY to:
#   - Ghana Card verification provider (KYC provider API)
#   - Supabase Storage (document upload/download via signed URLs)
# All other outbound traffic will be blocked at the egress gateway in production.
# See System Design doc §10.1 for the network boundary specification.

spring:
  application:
    name: stash-kyc

  config:
    import: optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://${KYC_DB_HOST:localhost}:${KYC_DB_PORT:5434}/${KYC_DB_NAME:kyc_db}
    username: ${KYC_DB_USER}
    password: ${KYC_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 3000
      validation-timeout: 2000
      keepalive-time: 30000
      max-lifetime: 600000
      maximum-pool-size: 5
      pool-name: KycHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
    open-in-view: false

  flyway:
    enabled: true
    locations:
      - classpath:db/migration/submission
      - classpath:db/migration/document
      - classpath:db/migration/outbox
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: stash

  jackson:
    time-zone: UTC

  mvc:
    problemdetails:
      enabled: false

server:
  port: 8082
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
    prometheus:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    db:
      enabled: true
  metrics:
    tags:
      service: ${spring.application.name}
    enable:
      jvm: true
      process: true
      system: true
      hikaricp: true
      http:
        server:
          requests: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
logging:
  config: classpath:logback-spring.xml

stash:
  kyc:
    ghana-card-encryption-key: ${GHANA_CARD_ENCRYPTION_KEY}
    base-url: ${STASH_KYC_BASE_URL:http://localhost:8082}
    # ⚠️ PLACEHOLDER admin auth — shared secret only, no real RBAC.
    # Replaced entirely by the v0.5 admin auth system.
    placeholder-admin-token: ${KYC_PLACEHOLDER_ADMIN_TOKEN}
    storage:
      bucket: kyc-documents
      provider: ${KYC_STORAGE_PROVIDER:local}
      local-root: ${KYC_LOCAL_STORAGE_PATH:/tmp/stash-kyc-storage}
  stub-provider:
  # Comma-separated Ghana Card numbers that auto-approve in the stub provider.
  # Per Issue Plan §0.1: team-controlled stub, real provider deferred to
  # Public Launch Readiness.
  test-approve-numbers: ${KYC_STUB_TEST_APPROVE_NUMBERS:GHA-000000001-1,GHA-000000002-2,GHA-000000003-3}

# Shared defaults for @SpringBootTest — override DB/AES via
# KycIntegrationTestSupport.registerPostgres() in integration tests.
spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  rabbitmq:
    listener:
      simple:
        auto-startup: false
      direct:
        auto-startup: false
  task:
    scheduling:
      enabled: false

stash:
  kyc:
    base-url: http://localhost:8082
    ghana-card-encryption-key: dGVzdC1hZXMtMjU2LWtleS0zMi1ieXRlcy1sb25nISE=
    storage:
      bucket: kyc-documents
      provider: local
  security:
    jwt:
      # Same value as monolith's application-test.yml.
      signing-key: dGVzdC1zaWduaW5nLWtleS1mb3ItdGVzdHMtb25seS0zMi1jaGFycw==

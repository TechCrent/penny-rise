spring:
  application:
    name: stash-monolith

  datasource:
    url: jdbc:postgresql://${MONOLITH_DB_HOST:localhost}:${MONOLITH_DB_PORT:5432}/${MONOLITH_DB_NAME:monolith_db}
    username: ${MONOLITH_DB_USER}
    password: ${MONOLITH_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      pool-name: MonolithHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations:
      - classpath:db/migration/user_module
      - classpath:db/migration/auth
      - classpath:db/migration/vault
      - classpath:db/migration/susu
      - classpath:db/migration/transfer
      - classpath:db/migration/challenge
      - classpath:db/migration/notification
      - classpath:db/migration/admin
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: stash

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
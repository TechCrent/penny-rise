spring:
  application:
    name: stash-monolith

  config:
    import: optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://${MONOLITH_DB_HOST:localhost}:${MONOLITH_DB_PORT:5436}/${MONOLITH_DB_NAME:monolith_db}
    username: ${MONOLITH_DB_USER}
    password: ${MONOLITH_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      pool-name: MonolithHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations:
      - classpath:db/migration/user_module
      - classpath:db/migration/auth
      - classpath:db/migration/vault
      - classpath:db/migration/susu
      - classpath:db/migration/transfer
      - classpath:db/migration/challenge
      - classpath:db/migration/notification
      - classpath:db/migration/admin
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: stash

  mvc:
    problemdetails:
      enabled: false

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
logging:
  config: classpath:logback-spring.xml

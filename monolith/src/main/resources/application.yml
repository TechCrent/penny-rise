spring:
  application:
    name: stash-monolith

  config:
    import: optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://${MONOLITH_DB_HOST:localhost}:${MONOLITH_DB_PORT:5436}/${MONOLITH_DB_NAME:monolith_db}
    username: ${MONOLITH_DB_USER}
    password: ${MONOLITH_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 3000
      validation-timeout: 2000
      keepalive-time: 30000
      max-lifetime: 600000
      maximum-pool-size: 10
      pool-name: MonolithHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations:
      - classpath:db/migration/user_module
      - classpath:db/migration/auth
      - classpath:db/migration/vault
      - classpath:db/migration/susu
      - classpath:db/migration/transfer
      - classpath:db/migration/challenge
      - classpath:db/migration/notification
      - classpath:db/migration/admin
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: false

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: stash

  mvc:
    problemdetails:
      enabled: false

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
    prometheus:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    db:
      enabled: true
  metrics:
    tags:
      service: ${spring.application.name}
    enable:
      jvm: true
      process: true
      system: true
      hikaricp: true
      http:
        server:
          requests: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
logging:
  config: classpath:logback-spring.xml

stash:
  payments:
    # Internal Payments Service base URL (server-to-server, same Docker network)
    internal-base-url: ${PAYMENTS_INTERNAL_BASE_URL:http://payments-service:8081}
  ledger:
    # FEE_REVENUE system ledger account (seeded in payments-service ledger V5).
    # Fixed UUID so config references it by value without a lookup query.
    fee-revenue-account-id: ${FEE_REVENUE_ACCOUNT_ID:00000000-0000-0000-0000-000000000002}
    # PENALTY_REVENUE system ledger account (seeded in payments-service ledger V6).
    # Receives the platform's half of the susu late-payment penalty split.
    penalty-revenue-account-id: ${PENALTY_REVENUE_ACCOUNT_ID:00000000-0000-0000-0000-000000000003}
  susu:
    late-penalty:
      # System constant per Decision 13. Overridable in v2.0 per-group config.
      # Total penalty: 500 pesewas (GHS 5). Split 50/50 per Overall doc §6.1.
      total-amount-pesewas: 500
      # Hours after scheduled_collection_at before a contribution is marked LATE
      grace-period-hours: 24
  internal:
    # Shared service token for /internal/** calls. Empty default keeps local/test
    # contexts bootable; production must set INTERNAL_SERVICE_TOKEN.
    service-token: ${INTERNAL_SERVICE_TOKEN:}
  kyc:
    # Internal kyc-service base URL — mobile hits the monolith proxy on :8080
    service-url: ${KYC_SERVICE_URL:http://localhost:8082}
  beta:
    allowlist-enabled: ${STASH_BETA_ALLOWLIST_ENABLED:true}
  email:
    # Switch between Resend (production) and SMTP (local/staging)
    # Set STASH_EMAIL_PROVIDER=resend to use Resend; default uses SMTP
    provider: ${STASH_EMAIL_PROVIDER:smtp}
    from-address: ${STASH_EMAIL_FROM:noreply@stash.local}
    from-name: ${STASH_EMAIL_FROM_NAME:Stash}
    resend-api-key: ${RESEND_API_KEY:}
    base-url: ${STASH_BASE_URL:http://localhost:8080}
  security:
    jwt:
      # Active signing key — base64-encoded HS256 secret (min 32 bytes decoded)
      # In production this comes from the secret manager, never from this file.
      signing-key: ${JWT_SIGNING_KEY}
      # Previous signing keys still accepted during rotation window (comma-separated)
      # Empty by default; populated during quarterly key rotation.
      verification-keys: ${JWT_VERIFICATION_KEYS:}
      access-token-expiry-minutes: 15
    bcrypt-cost: 12

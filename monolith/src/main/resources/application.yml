spring:
  application:
    name: stash-monolith

  config:
    import: optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://${MONOLITH_DB_HOST:localhost}:${MONOLITH_DB_PORT:5436}/${MONOLITH_DB_NAME:monolith_db}
    username: ${MONOLITH_DB_USER}
    password: ${MONOLITH_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 3000
      validation-timeout: 2000
      keepalive-time: 30000
      max-lifetime: 600000
      maximum-pool-size: 10
      pool-name: MonolithHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations:
      - classpath:db/migration/user_module
      - classpath:db/migration/auth
      - classpath:db/migration/vault
      - classpath:db/migration/susu
      - classpath:db/migration/transfer
      - classpath:db/migration/challenge
      - classpath:db/migration/notification
      - classpath:db/migration/admin
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: stash

  mvc:
    problemdetails:
      enabled: false

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
    prometheus:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    db:
      enabled: true
  metrics:
    tags:
      service: ${spring.application.name}
    enable:
      jvm: true
      process: true
      system: true
      hikaricp: true
      http:
        server:
          requests: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
logging:
  config: classpath:logback-spring.xml

stash:
  security:
    jwt:
      # Active signing key — base64-encoded HS256 secret (min 32 bytes decoded)
      # In production this comes from the secret manager, never from this file.
      signing-key: ${JWT_SIGNING_KEY}
      # Previous signing keys still accepted during rotation window (comma-separated)
      # Empty by default; populated during quarterly key rotation.
      verification-keys: ${JWT_VERIFICATION_KEYS:}
      access-token-expiry-minutes: 15

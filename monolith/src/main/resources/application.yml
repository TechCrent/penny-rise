spring:
  application:
    name: monolith
  datasource:
    url: jdbc:postgresql://localhost:5432/stash_monolith
    username: stash
    password: stash
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

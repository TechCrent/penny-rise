# Production profile overrides.
#
# Swagger UI and the raw OpenAPI spec are disabled in production —
# they must never be reachable on a hosted environment.

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

stash:
  paystack:
    sandbox:
      # Defense-in-depth: this must always be false in production, regardless of the
      # base application.yml default or any stray env var. See WithdrawalService.
      simulate-blocked-transfers: false
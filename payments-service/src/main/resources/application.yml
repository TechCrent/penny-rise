spring:
  application:
    name: stash-payments

  config:
    import: optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://${PAYMENTS_DB_HOST:localhost}:${PAYMENTS_DB_PORT:15433}/${PAYMENTS_DB_NAME:payments_db}
    username: ${PAYMENTS_DB_USER}
    password: ${PAYMENTS_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 3000
      validation-timeout: 2000
      keepalive-time: 30000
      max-lifetime: 600000
      maximum-pool-size: 10
      pool-name: PaymentsHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
    open-in-view: false

  # Spring Boot's single auto-configured Flyway bean is disabled — each
  # migration folder below independently starts at V1, and one combined
  # bean treats all `locations` as one shared version history, which
  # rejects the resulting duplicate version numbers across folders.
  # See com.stash.payments.config.FlywayMultiSchemaConfig for the
  # per-folder Flyway instances (one history table each) that replace it.
  flyway:
    enabled: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: stash

  jackson:
    time-zone: UTC

  mvc:
    problemdetails:
      enabled: false

server:
  port: 8081
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
    prometheus:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    db:
      enabled: true
  metrics:
    tags:
      service: ${spring.application.name}
    enable:
      jvm: true
      process: true
      system: true
      hikaricp: true
      http:
        server:
          requests: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
logging:
  config: classpath:logback-spring.xml

paystack:
  base-url: https://api.paystack.co
  secret-key: ${PAYSTACK_SECRET_KEY}   # sk_test_... for test mode; sk_live_... for live
  webhook-secret: ${PAYSTACK_WEBHOOK_SECRET}
  timeout-seconds: 30
  # Paystack sandbox test bank (code "002", not "TEST"). See docs/paystack-api-reference.md.
  sandbox:
    settlement-bank-code: "002"
    settlement-account-number: "0000000000"
  retry:
    max-attempts: 3
    initial-interval-ms: 500
    multiplier: 2.0
    max-interval-ms: 4000

stash:
  internal:
    service-token: ${INTERNAL_SERVICE_TOKEN}
  ledger:
    paystack-settlement-account-id: ${PAYSTACK_SETTLEMENT_ACCOUNT_ID}
  paystack:
    sandbox:
      # DEV/SANDBOX ONLY — never set true in any deployed environment. When enabled,
      # a withdrawal blocked by Paystack's sandbox "starter business" third-party-payout
      # restriction is completed locally (ledger reservation kept, no real Paystack
      # payout) instead of reversed, so local testing isn't blocked by an account-tier
      # restriction unrelated to our code. See WithdrawalService.SANDBOX_STARTER_BUSINESS_MARKER.
      simulate-blocked-transfers: ${PAYSTACK_SANDBOX_SIMULATE_BLOCKED_TRANSFERS:false}
      # DEV/SANDBOX ONLY — never set true in any deployed environment. When enabled
      # (AND the Paystack key is sk_test_ — both must be true, see DepositService),
      # deposits charge Paystack's real sandbox test MoMo number instead of the
      # user-entered one, so any valid Ghanaian number/provider can be used for
      # testing without every deposit requiring the one number Paystack's sandbox
      # actually resolves. Never affects what's stored or shown — only the outbound
      # Paystack charge itself. See DepositService.SANDBOX_TEST_MOMO_NUMBER.
      substitute-test-momo-number: ${PAYSTACK_SANDBOX_SUBSTITUTE_TEST_MOMO_NUMBER:false}
    reconciliation:
      # How long a deposit must sit PENDING before DepositReconciliationJob checks it
      # against Paystack's Verify Transaction API. Kept well above normal webhook
      # latency so this never races (or duplicates work with) a healthy webhook
      # delivery — it only kicks in when one is missed, delayed, or never had a
      # reachable callback URL to land on (e.g. local dev with no public tunnel).
      pending-threshold-seconds: ${PAYSTACK_RECONCILIATION_PENDING_THRESHOLD_SECONDS:60}

resilience4j:
  circuitbreaker:
    instances:
      paystack:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50          # open at 50% failure in sliding window
        minimum-number-of-calls: 5          # need at least 5 calls before evaluating
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
      # Isolated from "paystack" above: subaccount provisioning is a background,
      # best-effort operation driven off user signup (fire-and-forget via
      # RabbitMQ), not a user-facing payment action. A burst of provisioning
      # failures must never trip the SAME breaker guarding real-time
      # charges/transfers/withdrawals — that happened in local dev on
      # 2026-07-12 and made every payment operation fail-fast with a generic
      # "temporarily unavailable" error while the underlying issue was only
      # provisioning.
      paystack-subaccount-provisioning:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
  retry:
    instances:
      paystack-idempotent:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2.0
        retry-exceptions:
          - java.util.concurrent.TimeoutException
          - com.stash.payments.paystack.exception.PaystackServerException

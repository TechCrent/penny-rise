spring:
  application:
    name: stash-payments

  config:
    import: optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://${PAYMENTS_DB_HOST:localhost}:${PAYMENTS_DB_PORT:15433}/${PAYMENTS_DB_NAME:payments_db}
    username: ${PAYMENTS_DB_USER}
    password: ${PAYMENTS_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 3000
      validation-timeout: 2000
      keepalive-time: 30000
      max-lifetime: 600000
      maximum-pool-size: 10
      pool-name: PaymentsHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
    open-in-view: false

  flyway:
    enabled: true
    locations:
      - classpath:db/migration/ledger
      - classpath:db/migration/transaction
      - classpath:db/migration/outbox
      - classpath:db/migration/webhook
      - classpath:db/migration/idempotency
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: stash

  jackson:
    time-zone: UTC

  mvc:
    problemdetails:
      enabled: false

server:
  port: 8081
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
    prometheus:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    db:
      enabled: true
  metrics:
    tags:
      service: ${spring.application.name}
    enable:
      jvm: true
      process: true
      system: true
      hikaricp: true
      http:
        server:
          requests: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
logging:
  config: classpath:logback-spring.xml
